name: E2E Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  ENV: dev
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: eu-north-1
  ECR_REPO_SF: "maji-dev-shopfront"
  ECR_REPO_SM: "maji-dev-stockmanager"

jobs:
  # docker:
  #   name: Docker E2E Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
