  #       run: mvn --batch-mode --update-snapshots verify
  #     - name: Run Formatter
  #       run: mvn com.coveo:fmt-maven-plugin:format
  #     - name: Test
  #       run: mvn test

  docker-multi:
    name: Docker E2E Tests (Multi)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: "Setup Env"
        uses: ./.github/actions/setup-env
      - name: Maven Build StockManager
        run: |
          cd stockmanager
          mvn clean install

      - name: Maven Build Shopfront
        run: |          
          cd shopfront
          mvn clean install
          # docker build --no-cache -t $ECR_REGISTRY/$ECR_REPO_SF:$IMAGE_TAG . -f .
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/maji-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build, tag, and push image to Amazon ECR - StockManager
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # IMAGE_TAG: ${{ github.sha }}
          IMAGE_TAG: latest
          ECR_REPO_SM: ${{ env.ECR_REPO_SM }}
        run: |          
          docker build --no-cache -t $ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG . -f .
          docker tag $ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG" >> $GITHUB_OUTPUT

