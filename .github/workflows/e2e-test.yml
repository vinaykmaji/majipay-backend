name: E2E Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  ENV: dev
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: eu-north-1
  ECR_REPO_SF: "maji-dev-shopfront"
  ECR_REPO_SM: "maji-dev-stockmanager"

jobs:
  # docker:
  #   name: Docker E2E Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: "Setup Env"
  #       uses: ./.github/actions/setup-env
  #     - name: Build with Maven
  #       run: mvn --batch-mode --update-snapshots verify
  #     - name: Run Formatter
  #       run: mvn com.coveo:fmt-maven-plugin:format
  #     - name: Test
  #       run: mvn test

  build-and-test:
    name: Docker E2E Tests (Multi)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      
    steps:
      - name: StockManager
        uses: actions/checkout@v4

      - name: "Setup Env"
        uses: ./.github/actions/setup-env

      # - name: Maven Build
      #   run: |
      #     cd stockmanager
      #     mvn clean install

      - name: Build and unit test
        run: mvn -B verify -DskipITs

      - name: Integration tests
        run: mvn -B verify -Dit.test="**/*IT" -Dsurefire.skip=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
      
      # For finer control over the cache key — for example, busting the cache when pom.xml changes but not on every commit:
      # - name: Cache Maven dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.m2/repository
      #     key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      #     restore-keys: |
      #       ${{ runner.os }}-maven-

  publish-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # required for GitHub Container Registry
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/maji-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GithubActionsSession

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: StockManager
        uses: actions/checkout@v4

      - name: "Setup Env"
        uses: ./.github/actions/setup-env

      - name: Build JAR
        run: mvn -B package -DskipTests        

      - name: Docker Build, tag, and push image to Amazon ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # IMAGE_TAG: ${{ github.sha }}
          IMAGE_TAG: latest
          ECR_REPO_SM: ${{ env.ECR_REPO_SM }}
        run: |        
          cd stockmanager  
          docker build --no-cache -t $ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG . -f .
          docker tag $ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPO_SM:$IMAGE_TAG" >> $GITHUB_OUTPUT

